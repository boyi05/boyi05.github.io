<style>
html,body{margin:0;height:100%;background:#0b1a4a;font:700 17px -apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;overflow:hidden}
#sc{position:fixed;inset:0;width:100%;height:100%}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.cl{animation:cl 38s linear infinite}@keyframes cl{from{transform:translateX(-160px)}to{transform:translateX(460px)}}
.wv{animation:wv 3.2s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-18px)}}
.hero{animation:hero 2.2s ease-in-out infinite}@keyframes hero{50%{transform:translateY(-12px) rotate(-6deg)}}
.glow{animation:glow 2.2s ease-in-out infinite;transform-origin:140px 585px}@keyframes glow{50%{opacity:.55;transform:scale(1.18)}}
.bb{animation:bb 5s linear infinite}@keyframes bb{0%{transform:translateY(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-260px);opacity:0}}
.fs{animation:fs 14s linear infinite}@keyframes fs{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.fs2{animation:fs2 19s linear infinite}@keyframes fs2{from{transform:translateX(480px)}to{transform:translateX(-80px)}}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sw{50%{transform:rotate(7deg)}}
.ray{animation:ray 5s ease-in-out infinite}@keyframes ray{50%{opacity:.35}}
.gl{animation:gl 1.8s ease-in-out infinite}@keyframes gl{50%{opacity:0;transform:scale(.3)}}
#ttl{position:fixed;left:0;right:0;top:max(7vh,34px);text-align:center;pointer-events:none}
#ttl h1{margin:0;font-size:min(13vw,56px);letter-spacing:.06em;color:#ffe066;font-weight:900;
 text-shadow:0 3px 0 #c97a00,0 6px 0 #6b3a00,0 0 26px rgba(255,214,90,.65);animation:tb 3s ease-in-out infinite}
@keyframes tb{50%{transform:translateY(-4px)}}
#ttl div{margin-top:10px;font-size:13px;letter-spacing:.5em;color:#bfe3ff;text-shadow:0 2px 0 #0b1a4a}
#box{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
 background:linear-gradient(#1f3b9a,#122466);border:4px solid #fff;border-radius:12px;outline:3px solid #0a1440;
 box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 0 0 3px #4c6fd8;padding:22px 18px 16px}
#nm{position:absolute;top:-19px;left:14px;background:linear-gradient(#ffd84d,#f0a020);color:#5a2f00;border:3px solid #fff;outline:2px solid #0a1440;border-radius:8px;padding:2px 12px;font-size:15px}
#bar{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;color:#ffe066;margin-bottom:10px}
#bar b{flex:1;height:14px;border:2px solid #fff;border-radius:4px;background:#0a1440;position:relative;overflow:hidden}
#bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#ffd84d 0 10px,#f0a020 10px 12px);transition:width .25s}
#pc{min-width:38px;text-align:right}
#t{min-height:3.2em;line-height:1.6;font-size:18px;white-space:pre-line}
#t small{color:#bfe3ff;font-weight:500}
#cur{display:inline-block;margin-left:4px;color:#ffe066;animation:cu .7s steps(1) infinite}@keyframes cu{50%{opacity:0}}
#t button{margin-top:10px;border:3px solid #fff;border-radius:10px;background:#f0a020;color:#4a2a00;font:inherit;padding:6px 18px;box-shadow:0 4px 0 #8a5000}
</style>

 <g class="gl" style="transform-origin:22px -20px;animation-delay:-.9s"><path d="M22 -27 L23.5 -21.5 L29 -20 L23.5 -18.5 L22 -13 L20.5 -18.5 L15 -20 L20.5 -21.5Z" fill="#fff"/></g>
</g>
<!-- hero: 海底的小星星 -->

 <polygon points="0.0,-34.0 9.4,-12.9 32.3,-10.5 15.2,4.9 20.0,27.5 0.0,16.0 -20.0,27.5 -15.2,4.9 -32.3,-10.5 -9.4,-12.9" fill="url(#hs)" stroke="#ffb21e" stroke-width="9" stroke-linejoin="round"/>
 <polygon points="0.0,-34.0 9.4,-12.9 32.3,-10.5 15.2,4.9 20.0,27.5 0.0,16.0 -20.0,27.5 -15.2,4.9 -32.3,-10.5 -9.4,-12.9" fill="none" stroke="#c97a00" stroke-width="2.5" stroke-linejoin="round" transform="scale(1.13)"/>
 <ellipse cx="-7" cy="-2" rx="3" ry="4.2" fill="#3a2410"/><ellipse cx="7" cy="-2" rx="3" ry="4.2" fill="#3a2410"/><circle cx="-6" cy="-3.5" r="1.2" fill="#fff"/><circle cx="8" cy="-3.5" r="1.2" fill="#fff"/>

<div id="ttl"><h1>海底有星星</h1><div>ISLAND ✦ ADVENTURE</div></div>
<div id="box"><div id="nm">★ 小星星</div><div id="bar">LOADING<b><i id="pb"></i></b><span id="pc">0%</span></div><div id="t"></div></div>
<script>
(function(){
// 入口：用網址後面的專屬通行碼（?k=…）向 Apps Script 拿資料，再換成小孩或爸媽的畫面
var API="https://script.google.com/macros/s/AKfycbxuBaNwtSbUeN8Orm5bwUJU-BUXgLyJMR7O6EGc7NPX7ONjg5AWxkOqiwPBdQokXwn7/exec";
var NS='http://www.w3.org/2000/svg';
function deco(){var s='',i,x,y;
  for(i=0;i<46;i++){x=(i*83+17)%400;y=(i*47+11)%300;s+='<circle class="tw" cx="'+x+'" cy="'+y+'" r="'+(i%5?1.1:2)+'" fill="#fff" style="animation-delay:-'+(i%9)*0.3+'s"/>'}
  document.getElementById('stars').innerHTML=s;
  s='';var W=[[18,650,70,'#2fae6a'],[96,640,56,'#3fbf7a'],[214,650,64,'#2fae6a'],[330,640,48,'#3fbf7a'],[386,650,60,'#2fae6a']];
  for(i=0;i<W.length;i++){x=W[i][0];y=W[i][1];var h=W[i][2];s+='<path class="sw" style="animation-delay:-'+i*0.7+'s" d="M'+x+' '+y+' Q'+(x-12)+' '+(y-h/3)+' '+x+' '+(y-h/2)+' Q'+(x+12)+' '+(y-h*0.7)+' '+(x+2)+' '+(y-h)+'" fill="none" stroke="'+W[i][3]+'" stroke-width="6" stroke-linecap="round"/>'}
  document.getElementById('weed').innerHTML=s;
  s='';for(i=0;i<12;i++){x=110+(i*37)%70;s+='<circle class="bb" cx="'+x+'" cy="'+(560-(i%3)*6)+'" r="'+(2+i%4)+'" fill="none" stroke="#dff4ff" stroke-width="1.4" style="animation-delay:-'+(i*0.45)+'s"/>'}
  for(i=0;i<6;i++){x=262+(i*13)%30;s+='<circle class="bb" cx="'+x+'" cy="600" r="'+(1.5+i%3)+'" fill="none" stroke="#dff4ff" stroke-width="1.2" style="animation-delay:-'+(i*0.8)+'s"/>'}
  document.getElementById('bub').innerHTML=s}
try{deco()}catch(e){}
var T=document.getElementById('t'),PB=document.getElementById('pb'),PC=document.getElementById('pc');
var prog=0,goal=0,typing=0,tipT=0;
function setP(p){prog=p;PB.style.width=p+'%';PC.textContent=Math.round(p)+'%'}
var pt=setInterval(function(){if(prog<goal)setP(Math.min(goal,prog+Math.max(.4,(goal-prog)*.12)))},80);
function say(msg,done){clearTimeout(typing);var i=0;T.innerHTML='';
  (function step(){i++;T.innerHTML=msg.slice(0,i).replace(/</g,'&lt;')+'<span id="cur">▼</span>';if(i<msg.length)typing=setTimeout(step,38);else if(done)done()})()}
var k=new URLSearchParams(location.search).get('k')||'';
try{if(k)localStorage.setItem('k',k);else k=localStorage.getItem('k')||''}catch(e){}
var guess='';try{guess=localStorage.getItem('role')||''}catch(e){}
var TIPS=guess==='parent'?['小提示：在「郗芝炘團隊」可以看每個孩子的台幣存摺和排行榜。','小提示：⚙️ 定存設定可以調利率和最低存款金額。','小提示：孩子回報的任務會出現在收件匣，記得審核喔！','小提示：在廣場發文可以附上照片，最多 4 張。']
 :['小提示：完成任務可以拿到金幣和經驗喔！','小提示：遊樂區的遊戲每天前 3 場有金幣獎勵。','小提示：寵物肚子餓了要記得餵牠！','小提示：錢放定存會長利息，想用時可以隨時解約。','小提示：三個人一起完成合作任務，商店會降價！','小提示：在廣場許願，說不定會實現喔 ✨','小提示：數獨越快完成，紀錄越厲害！'];
function tips(){var n=Math.floor(Math.random()*TIPS.length);tipT=setTimeout(function(){say(TIPS[n%TIPS.length],function(){tipT=setTimeout(tips,2600)})},1400)}
function fail(msg){clearTimeout(tipT);clearInterval(pt);document.getElementById('bar').style.display='none';
  say('哎呀！'+msg,function(){var c=document.getElementById('cur');if(c)c.remove();T.innerHTML+='<br>'+'<small>如果一直這樣，請截圖給爸爸</small><br><button onclick="location.reload()">重新整理</button>'})}
if(!k){document.getElementById('bar').style.display='none';say('嗨！我是海底的小星星 ⭐\n請用你的專屬連結打開海底有星星喔！')}
else{
  goal=70;say(guess==='parent'?'歡迎回來！正在整理海星家的帳本…':'嗨！我是海底的小星星 ⭐\n正在打開你的小島…',tips);
  var pages={};function page(r){return pages[r]||(pages[r]=fetch(r+'.html',{cache:'no-cache'}).then(function(x){if(!x.ok)throw new Error('畫面載入失敗');return x.text()}))}
  if(guess==='kid'||guess==='parent')page(guess);
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'boot',args:[k]}),redirect:'follow'})
  .then(function(r){if(!r.ok)throw new Error('連線失敗（'+r.status+'）');return r.json()})
  .then(function(j){
    if(!j.ok)throw new Error(j.err);
    var b=j.v;try{localStorage.setItem('role',b.role)}catch(e){}
    goal=92;
    return page(b.role).then(function(html){
      var data=JSON.stringify(b).replace(/</g,'\\x3c');
      html=html.replace('<?!= boot ?>',function(){return data});
      clearTimeout(tipT);goal=100;setP(100);
      say('歡迎回來，'+(b.name||'')+'！',null);
      setTimeout(function(){clearInterval(pt);document.open();document.write(html);document.close()},650);
    });
  })
  .catch(function(e){fail(/fetch|Load failed|NetworkError/i.test(e.message)?'網路好像斷了':e.message)});
}
})();
</script>
</body>
</html>
