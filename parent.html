// 選照片→縮小→轉成 data URL（自動壓到 48KB 以內）
function pickPhoto(max,lim){lim=lim||48000;return new Promise((ok,no)=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/'+'*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return no(new Error('沒有選照片'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    let w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));const cv=document.createElement('canvas');
    for(let q=.82,tries=0;tries<8;tries++){cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const u=cv.toDataURL('image/jpeg',q);if(u.length<lim)return ok(u);if(q>.5)q-=.1;else s*=.8}
    no(new Error('照片太大，請換一張'))};im.onerror=()=>no(new Error('讀不到這張照片'));im.src=fr.result};fr.readAsDataURL(f)};inp.click()})}

  if(v==='task')$('#setBody').innerHTML=`<button class="btn" onclick="taskBox()">＋ 新增任務</button><div class="card">${CFG.tasks.map((t,i)=>`<div class="it" style="${t.status==='下架'?'opacity:.45':''}"><div class="ic">${t.type==='團隊'?'🤝':D5[t.diff-1]}</div>
   <div class="t">${esc(t.name)}<div class="mu">${t.type==='團隊'?'團隊・':''}難度 ${t.diff}・+${t.exp} 經驗・+${n(t.coins)} 金幣${t.cash?`・<b class="plus">+${n(t.cash)} 元</b>`:''}${t.status==='下架'?'・已下架':''}</div></div><button class="sbtn" onclick="taskBox(${i})">編輯</button></div>`).join('')}</div>`;
  if(v==='shop'){$('#setBody').innerHTML=`<button class="btn" onclick="prodBox()">＋ 新增商品</button><div class="card">${CFG.shop.map((p,i)=>`<div class="it" style="${p.status==='下架'?'opacity:.45':''}"><div class="ic">${p.photo?imgTag(p.photo,'thumb'):(p.type==='兌換'?'💵':'🎁')}</div>
   <div class="t">${esc(p.name)}<div class="mu">${n(p.price)} 金幣${p.type==='兌換'?`・換 ${n(p.ntd)} 元`:''}${p.status==='下架'?'・已下架':''}</div></div><button class="sbtn" onclick="prodBox(${i})">編輯</button></div>`).join('')}</div>`;loadImgs(CFG.shop.map(p=>p.photo))}
  if(v==='fam')loadMembers()}
let TB={};
async function taskBox(i){const t=i===undefined?{name:'',exp:5,coins:30,diff:2,type:'個人',status:'上架'}:CFG.tasks[i];TB=Object.assign({},t);
  if(!await ask(`<h3>${t.id?'編輯任務':'新增任務'}</h3><label>任務名稱</label><input id="tb_n" value="${esc(t.name)}">
   <div class="two"><div><label>經驗</label><input id="tb_e" type="number" value="${t.exp}"></div><div><label>金幣</label><input id="tb_c" type="number" value="${t.coins}"></div></div>
   <label>現金獎勵（元，選填；通過時直接存進存摺）</label><input id="tb_m" type="number" inputmode="numeric" value="${t.cash||''}" placeholder="0">
   <label>難度</label><div class="chips">${[1,2,3,4,5].map(d=>`<button type="button" class="chip ${t.diff===d?'on':''}" onclick="TB.diff=${d};this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${D5[d-1]}<br>${d}</button>`).join('')}</div>
   <label>類型</label><div class="chips">${['個人','團隊'].map(x=>`<button type="button" class="chip ${t.type===x?'on':''}" onclick="TB.type='${x}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>
   <label>狀態</label><div class="chips">${['上架','下架'].map(x=>`<button type="button" class="chip ${t.status===x?'on':''}" onclick="TB.status='${x}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>${t.id?`<button type="button" class="btn red" onclick="$('#modal').classList.add('hidden');delTask('${t.id}')">🗑️ 刪除這個任務</button>`:''}`,'儲存'))return;
  TB.name=$('#tb_n').value;TB.exp=$('#tb_e').value;TB.coins=$('#tb_c').value;TB.cash=$('#tb_m').value;if(await run(null,'saveTask',TB)!==null)loadSet()}
async function delTask(id){const t=CFG.tasks.find(x=>x.id===id);if(!await ask(`<h3>刪除任務「${esc(t.name)}」？</h3>以前做過的紀錄不會不見。<br><span class="mu">只想暫時不讓小孩看到，可以改用「下架」。</span>`,'刪除'))return;if(await run(null,'deleteTask',{id})!==null)loadSet()}
async function delProd(id){const p=CFG.shop.find(x=>x.id===id);if(!await ask(`<h3>刪除商品「${esc(p.name)}」？</h3>以前買過的紀錄不會不見。<br><span class="mu">只想暫時不賣，可以改用「下架」。</span>`,'刪除'))return;if(await run(null,'deleteProduct',{id})!==null)loadSet()}
let PB={};
async function prodBox(i){const p=i===undefined?{name:'',price:100,type:'商品',ntd:'',status:'上架',photo:''}:CFG.shop[i];PB=Object.assign({},p,{photoData:'',clearPhoto:false});
  if(!await ask(`<h3>${p.id?'編輯商品':'新增商品'}</h3><div id="pb_img" class="pbimg">${p.photo?imgTag(p.photo,'big'):'<span>📷</span>'}</div>
   <div class="two"><button type="button" class="sbtn" onclick="pbPhoto()">上傳照片</button><button type="button" class="sbtn" onclick="PB.clearPhoto=true;PB.photoData='';$('#pb_img').innerHTML='<span>📷</span>'">移除照片</button></div>
   <label>商品名稱</label><input id="pb_n" value="${esc(p.name)}"><label>價格（金幣）</label><input id="pb_p" type="number" value="${p.price}">
   <label>類型</label><div class="chips">${['商品','兌換'].map(x=>`<button type="button" class="chip ${p.type===x?'on':''}" onclick="PB.type='${x}';$('#pb_ntdBox').classList.toggle('hidden','${x}'!=='兌換');this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x==='兌換'?'兌換台幣':'一般商品'}</button>`).join('')}</div>
   <div id="pb_ntdBox" class="${p.type==='兌換'?'':'hidden'}"><label>兌換成多少台幣（存進存摺）</label><input id="pb_t" type="number" value="${p.ntd||''}"></div>
   <label>狀態</label><div class="chips">${['上架','下架'].map(x=>`<button type="button" class="chip ${p.status===x?'on':''}" onclick="PB.status='${x}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>${p.id?`<button type="button" class="btn red" onclick="$('#modal').classList.add('hidden');delProd('${p.id}')">🗑️ 刪除這個商品</button>`:''}`,'儲存'))return;
  PB.name=$('#pb_n').value;PB.price=$('#pb_p').value;PB.ntd=($('#pb_t')||{}).value;toast('儲存中…');if(await run(null,'saveProduct',PB)!==null)loadSet()}
async function pbPhoto(){try{PB.photoData=await pickPhoto(320);PB.clearPhoto=false;$('#pb_img').innerHTML=`<img class="big" src="${PB.photoData}">`}catch(e){toast(errMsg(e),1)}}
// 固定扣款
async function loadRecur(){try{recs=await call('listRecurring')}catch(e){return toast(errMsg(e),1)}
  $('#recR').innerHTML=`<button class="btn" onclick="recBox()">＋ 新增每月固定支出</button><div class="card"><div class="mu">每月到了扣款日，會自動記一筆進海星家帳本（算在設定的支出者身上）</div>${recs.map((r,i)=>`<div class="it" style="${r.status==='啟用'?'':'opacity:.45'}"><div class="ic">${em(r.cat)}</div>
   <div class="t">${esc(r.name)}<div class="mu">每月 ${r.day} 號・${n(r.amount)} 元・${esc(r.cat)}・${r.payer?esc(r.payer)+' 付':'<span class="red">未設定誰付</span>'}${r.status==='啟用'?'':'・已停用'}</div></div><button class="sbtn" onclick="recBox(${i})">編輯</button></div>`).join('')||'<div class="empty">還沒有固定扣款</div>'}</div>`}
let RB={};
async function recBox(i){const r=i===undefined?{name:'',amount:'',cat:S.cats.includes('通訊')?'通訊':S.cats[0],day:'',status:'啟用',payer:S.me}:recs[i];RB={status:r.status,payer:r.payer||''};
  if(!await ask(`<h3>${r.row?'編輯':'新增'}每月固定支出</h3><label>名稱</label><input id="rb_n" value="${esc(r.name)}" placeholder="例如：手機費"><div class="two"><div><label>每月金額</label><input id="rb_a" type="number" inputmode="numeric" value="${r.amount}"></div><div><label>每月幾號</label><input id="rb_d" type="number" inputmode="numeric" value="${r.day}"></div></div>
   <label>分類</label><select id="rb_c">${S.cats.map(c=>`<option ${c===r.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <label>誰付的</label><div class="chips" id="rb_p"></div>
   ${r.row?'<label>狀態</label><div class="chips" id="rb_s"></div>':''}
   ${r.row?`<button type="button" class="btn red" onclick="$('#modal').classList.add('hidden');delRecur(${i})">🗑️ 刪除這個固定支出</button>`:''}`,'儲存',undefined,drawRB))return;
  const d={name:$('#rb_n').value.trim(),amount:$('#rb_a').value,cat:$('#rb_c').value,day:$('#rb_d').value,status:RB.status,payer:RB.payer};if(r.row)d.row=r.row;
  if(!(d.day>=1&&d.day<=31))return toast('扣款日要在 1～31 號',1);if(await run(null,'saveRecurring',d)!==null)loadRecur()}
function drawRB(){chips($('#rb_p'),S.parents,RB.payer,v=>{RB.payer=v;drawRB()},v=>av(v,20)+' '+esc(PF(v).nick||v));if($('#rb_s'))chips($('#rb_s'),['啟用','停用'],RB.status,v=>{RB.status=v;drawRB()})}
async function delRecur(i){const r=recs[i];if(!await ask(`<h3>刪除「${esc(r.name)}」？</h3>以後不會再自動扣款。之前已經記進帳本的不會刪掉。<br><span class="mu">只想暫停的話，可以改成「停用」。</span>`,'刪除'))return;
  if(await run(null,'deleteRecurring',{row:r.row,name:r.name})!==null)loadRecur()}
// 家人
async function loadMembers(){try{mems=await call('listMembers')}catch(e){return toast(errMsg(e),1)}
  $('#setBody').innerHTML=`<div class="card"><div class="mu">每個人用自己的 QR code 打開。爸媽改小孩的暱稱和頭像不受每天一次的限制。</div>${mems.map((m,i)=>`<div class="it"><div class="ic" onclick="famBox(${i})">${avatar({photo:m.photo,icon:m.avatar},38)}</div>
   <div class="t"><b>${esc(m.nick)}</b> <span class="mu">${esc(m.name)}</span><div class="mu">${S.parents.includes(m.name)?'爸媽・全部功能':m.test?'🧪 測試帳號・不影響任何紀錄':'小孩'}</div></div>
   <button class="sbtn" onclick="famBox(${i})">資料</button><button class="sbtn" onclick="showQR(${i})">QR</button></div>`).join('')}</div>`;loadImgs(mems.map(m=>m.photo))}
async function famBox(i){const m=mems[i];
  await ask(`<h3>${esc(m.name)} 的資料</h3><label>暱稱</label><input id="fb_n" value="${esc(m.nick)}"><button class="btn" onclick="famNick('${esc(m.name)}')">儲存暱稱</button>
   <label>頭像</label><button class="btn" onclick="famPhoto('${esc(m.name)}')">📷 上傳照片</button><div class="pick">${Object.keys(SPR).map(k=>`<button onclick="famIcon('${esc(m.name)}','${k}')">${sprite(k,40)}</button>`).join('')}</div>`,null,'關閉')}
async function famNick(nm){const v=$('#fb_n').value.trim();if(await run(null,'setProfile',{name:nm,nick:v})!==null)refreshFam()}
async function famIcon(nm,k){if(await run(null,'setProfile',{name:nm,icon:k})!==null)refreshFam()}
async function famPhoto(nm){let d;try{d=await pickPhoto(256)}catch(e){return toast(errMsg(e),1)}if(await run(null,'setProfile',{name:nm,photo:d})!==null)refreshFam()}
async function refreshFam(){$('#modal').classList.add('hidden');try{const r=await call('getInit');S.profiles=r.profiles}catch(e){}loadMembers()}
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}}
function showQR(i){const m=mems[i];ask(`<h3>${esc(m.name)} 的專屬 QR code</h3><div class="qr">${qrSvg(m.url)||'（請改用下面的連結）'}</div><input readonly value="${esc(m.url)}" onclick="this.select()" style="font-size:12px">
   <button class="btn red" onclick="renewQR(${i})">換新 QR code（舊的會失效）</button>`,null,'關閉')}
async function renewQR(i){const m=mems[i];$('#modal').classList.add('hidden');
  if(!await ask(`<h3>換新 ${esc(m.name)} 的 QR code？</h3>舊的會馬上失效。${m.name===S.me?'<br><b class="red">你現在用的連結也會失效！</b>':''}`,'換新'))return;
  const r=await run(null,'resetToken',m.name);if(!r)return;await loadMembers();showQR(mems.findIndex(x=>x.name===m.name))}

/* ===== 啟動 ===== */
function start(r){S=r;st.payer=r.me;st.pCat=st.kCat=r.cats[0]||'';st.kKid=st.kid=r.kids[0]||'';$('#pDate').value=$('#kDate').value=r.today;
  buildDock();drawRec();setRange('this')}
if(BOOT.init){start(BOOT.init);loadHome(BOOT.home);foCheck()}
else call('getInit').then(r=>{start(r);loadHome()}).catch(e=>{toast('載入失敗：'+errMsg(e),1);$('#homeBody').innerHTML='<div class="card empty">⚠️ 載入失敗：'+esc(errMsg(e))+'<br>請截圖給爸爸</div>'});

</script>
</body></html>
