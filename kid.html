// 選照片→縮小→轉成 data URL（自動壓到 48KB 以內）
function pickPhoto(max,lim){lim=lim||48000;return new Promise((ok,no)=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/'+'*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return no(new Error('沒有選照片'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    let w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));const cv=document.createElement('canvas');
    for(let q=.82,tries=0;tries<8;tries++){cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const u=cv.toDataURL('image/jpeg',q);if(u.length<lim)return ok(u);if(q>.5)q-=.1;else s*=.8}
    no(new Error('照片太大，請換一張'))};im.onerror=()=>no(new Error('讀不到這張照片'));im.src=fr.result};fr.readAsDataURL(f)};inp.click()})}

function pie(cats,total,bg){if(!total)return '<div class="empty">這段期間沒有支出 🎉</div>';const R=90,C=100;let a=-Math.PI/2,out='';
  cats.forEach((c,i)=>{const f=c.sum/total,col=COL[i%COL.length];
    if(f>=0.9999){out+=`<circle cx="${C}" cy="${C}" r="${R}" fill="${col}" onclick="showCat(${i})"/>`;return}
    const b=a+f*2*Math.PI,x1=C+R*Math.cos(a),y1=C+R*Math.sin(a),x2=C+R*Math.cos(b),y2=C+R*Math.sin(b);
    out+=`<path d="M${C},${C} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${f>0.5?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${col}" stroke="${bg}" stroke-width="2" onclick="showCat(${i})"/>`;a=b});
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:240px;display:block;margin:4px auto">${out}<circle cx="100" cy="100" r="54" fill="${bg}"/>

  if(have<x.price)return toast((x.cur==='台幣'?'存摺的錢':'金幣')+'還差 '+(x.price-have)+' 喔',1);
  const upd=()=>{const q=+$('#mkQ').value,t=q*x.price;$('#mkT').innerHTML=`共 <b>${mkMoney(x.cur,t)}</b>，買完還剩 <b>${n(have-t)}</b>${x.cur==='台幣'?' 元':' 金幣'}${t>have?'<br><b style="color:#d04040">不夠喔！</b>':''}`};
  window.mkQ=d=>{const e=$('#mkQ');e.value=Math.max(1,Math.min(max,+e.value+d));upd()};
  setTimeout(upd,0);
  if(!await ask(`<h3>跟 ${esc(x.seller)} 買「${esc(x.name)}」</h3>${x.photo?imgTag(x.photo,'mkbig'):''}${x.desc?`<div class="mu">${esc(x.desc)}</div>`:''}
    <div class="mkqty"><button type="button" onclick="mkQ(-1)">－</button><input id="mkQ" type="number" value="1" min="1" max="${max}" readonly><button type="button" onclick="mkQ(1)">＋</button></div>
    <div id="mkT" style="text-align:center"></div><div class="mu" style="margin-top:6px">錢會先由市集保管，${esc(x.seller)} 交貨、你按「收到了」才會付給對方。交貨前都可以取消。</div>`,'下單'))return;
  const q=+$('#mkQ').value;if(q*x.price>have)return toast('錢不夠喔',1);
  const r=await run(null,'mktBuy',{id:id,qty:q});if(r){if(typeof sfx==='function')sfx('coin');MK.tab='orders';mktOpen(MK.el,1);if(typeof mktChanged==='function')mktChanged()}}
function mkOrderRow(o,as){const D=MK.d,me=D.name,par=D.parent,isSeller=o.seller===me||(par&&D.parents.indexOf(o.seller)>=0),isBuyer=o.buyer===me;
  const fee=o.status==='已完成'?o.fee:mkFee(o);
  const acts=[];if(o.status==='待交貨'&&isSeller)acts.push(`<button class="ok" onclick="mktAct('mktShip','${o.id}')">📦 已交貨</button>`);
  if(o.status==='已交貨'&&isBuyer)acts.push(`<button class="ok" onclick="mktAct('mktDone','${o.id}','收到「${esc(o.name)}」了嗎？按下去錢就會付給 ${esc(o.seller)}。')">✅ 收到了</button>`);
  if(par&&!isBuyer&&(o.status==='待交貨'||o.status==='已交貨')&&!isSeller)acts.push(`<button onclick="mktAct('mktDone','${o.id}','幫 ${esc(o.buyer)} 按收到？錢會付給 ${esc(o.seller)}。')">幫忙完成</button>`);
  if((o.status==='待交貨'&&(isBuyer||isSeller||par))||(o.status==='已交貨'&&(isSeller||par)))acts.push(`<button class="no" onclick="mktAct('mktCancel','${o.id}','取消這筆訂單？錢會全部退給 ${esc(o.buyer)}。')">取消</button>`);
  const who=as==='sell'?`${esc(o.buyer)} 買的`:as==='buy'?`跟 ${esc(o.seller)} 買`:`${esc(o.buyer)} → ${esc(o.seller)}`;
  return `<div class="mkit"><span>${mkThumb(o.photo)}</span><div class="mkn"><b>${esc(o.name)}${o.qty>1?' ×'+o.qty:''}</b><div class="mu">${who}・${new Date(o.at).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}</div>
   <div class="mkm"><span class="mkst" style="background:${MK_ST[o.status]||'#888'}">${o.status}</span> ${mkMoney(o.cur,o.total)}${!D.parents.includes(o.seller)&&(as==='sell'||par)&&o.status!=='已取消'?`<span class="mu">（手續費 ${fee}，實拿 ${o.total-fee}）</span>`:''}</div>
   ${o.note?`<div class="mu">${esc(o.note)}</div>`:''}${acts.length?`<div class="mkacts">${acts.join('')}</div>`:''}</div></div>`}
async function mktAct(fn,id,q){if(q&&!await ask(`<h3>${q}</h3>`,'確定'))return;const r=await run(null,fn,{id:id});if(r!==null){if(fn==='mktDone'&&typeof sfx==='function')sfx('coin');mktOpen(MK.el,1);if(typeof mktChanged==='function')mktChanged()}}
function mktStall(){const D=MK.d,me=D.name,par=D.parent,mine=x=>x.seller===me||(par&&D.parents.indexOf(x.seller)>=0);
  const L=D.items.filter(mine).sort((a,b)=>(a.status!=='上架')-(b.status!=='上架')||a.seller.localeCompare(b.seller)||b.at-a.at);
  const O=D.orders.filter(o=>mine({seller:o.seller})&&(o.status==='待交貨'||o.status==='已交貨'));
  return `${O.length?`<div class="card"><h3>📮 要處理的訂單</h3>${O.map(o=>mkOrderRow(o,'sell')).join('')}</div>`:''}
   <button class="stubig" onclick="mktItemBox()">＋ 上架商品</button>
   <div class="card">${L.map(x=>`<div class="mkit${x.status!=='上架'?' out':''}"><span onclick="mktPic('${x.id}')">${mkThumb(x.photo,x.type==='兌換'?'💵':'🎁')}</span>
     <div class="mkn"><b>${esc(x.name)}</b>${par?` <span class="mksel">${esc(x.seller)}</span>`:''}<div class="mkm">${mkMoney(x.cur,x.price)}${x.type==='兌換'?` → ${x.ntd} 元`:''}・${x.stock===null?'不限量':'庫存 '+x.stock}・賣出 ${x.sold}${x.status!=='上架'?'・<b>下架中</b>':''}</div>
     <div class="mkacts"><button onclick="mktItemBox('${x.id}')">✏️ 修改</button><button onclick="mktToggle('${x.id}')">${x.status==='上架'?'下架':'上架'}</button><button class="no" onclick="mktDelOne('${x.id}')">🗑️</button></div></div></div>`).join('')||'<div class="empty">還沒有商品，按上面的按鈕上架第一個！</div>'}</div>
   <div class="card mu">💡 可以賣自己做的東西、不要的玩具，或是服務（例如「幫你收碗一次」）。成交時扣 ${Math.round(D.fee*100)}% 手續費（最少 1）。</div>`}
function mktOrders(){const D=MK.d,me=D.name;if(D.parent)return `<div class="card">${D.orders.map(o=>mkOrderRow(o,'all')).join('')||'<div class="empty">還沒有交易</div>'}</div>`;
  const B=D.orders.filter(o=>o.buyer===me),S=D.orders.filter(o=>o.seller===me&&(o.status==='已完成'||o.status==='已取消'));
  return `<div class="card"><h3>🛍️ 我買的</h3>${B.map(o=>mkOrderRow(o,'buy')).join('')||'<div class="empty">還沒買過東西</div>'}</div>
   <div class="card"><h3>💰 我賣掉的</h3>${S.map(o=>mkOrderRow(o,'sell')).join('')||'<div class="empty">還沒賣出東西</div>'}</div>`}
async function mktToggle(id){const x=MK.d.items.find(i=>i.id===id);const r=await run(null,'mktSave',Object.assign({},x,{status:x.status==='上架'?'下架':'上架',stock:x.stock===null?'':x.stock}));if(r!==null)mktOpen(MK.el,1)}
async function mktDelOne(id){const x=MK.d.items.find(i=>i.id===id);if(!await ask(`<h3>刪除「${esc(x.name)}」？</h3>以前的交易紀錄不會不見。`,'刪除'))return;const r=await run(null,'mktDel',{id:id});if(r!==null)mktOpen(MK.el,1)}
let MKF=null;
async function mktItemBox(id){const D=MK.d,x=id?D.items.find(i=>i.id===id):null;MKF=x?Object.assign({},x,{photoData:'',clearPhoto:false}):{name:'',desc:'',cur:'金幣',price:10,stock:1,photo:'',status:'上架',type:'商品',ntd:''};
  const chip=(k,v,lab)=>`<button type="button" class="chip ${MKF[k]===v?'on':''}" onclick="MKF.${k}='${v}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));this.classList.add('on');mkfSync()">${lab||v}</button>`;
  window.mkfSync=()=>{const t=$('#mkfNtd');if(t)t.classList.toggle('hidden',!(MKF.type==='兌換'&&MKF.cur==='金幣'));const u=$('#mkfUnit');if(u)u.textContent=MKF.cur==='台幣'?'元':'金幣'};
  window.mkfPhoto=async()=>{try{MKF.photoData=await pickPhoto(640,48000);MKF.clearPhoto=false;$('#mkfImg').innerHTML=`<img src="${MKF.photoData}" class="mkbig">`}catch(e){if(e.message!=='沒有選照片')toast(e.message,1)}};
  if(!await ask(`<h3>${x?'修改商品':'上架商品'}</h3>
    <div id="mkfImg" class="mkfimg" onclick="mkfPhoto()">${x&&x.photo?imgTag(x.photo,'mkbig'):'<span>📷<br>拍照或選照片</span>'}</div>
    <label class="cfl">商品名稱</label><input id="mkfN" class="mkin" maxlength="20" value="${esc(MKF.name)}" placeholder="例如：自己做的書籤">
    <label class="cfl">說明（可不填）</label><input id="mkfD" class="mkin" maxlength="60" value="${esc(MKF.desc)}" placeholder="例如：可以選喜歡的顏色">
    <label class="cfl">用什麼付錢</label><div class="chips mkchips">${chip('cur','金幣','🪙 金幣')}${chip('cur','台幣','💵 台幣（存摺）')}</div>
    <label class="cfl">單價（<span id="mkfUnit">${MKF.cur==='台幣'?'元':'金幣'}</span>）</label><input id="mkfP" class="mkin" type="number" min="1" value="${MKF.price}">
    <label class="cfl">庫存（空白＝不限量，例如服務）</label><input id="mkfS" class="mkin" type="number" min="0" value="${MKF.stock===null?'':MKF.stock}">
    ${D.parent?`<label class="cfl">類型</label><div class="chips mkchips">${chip('type','商品','🎁 一般商品')}${chip('type','兌換','💱 金幣換台幣')}</div>
     <div id="mkfNtd" class="${MKF.type==='兌換'&&MKF.cur==='金幣'?'':'hidden'}"><label class="cfl">可以換多少台幣（元）</label><input id="mkfT" class="mkin" type="number" min="1" value="${MKF.ntd||''}"></div>`:''}
    <label class="cfl">狀態</label><div class="chips mkchips">${chip('status','上架')}${chip('status','下架')}</div>`,x?'儲存':'上架'))return;
  const arg={id:x?x.id:null,name:$('#mkfN').value,desc:$('#mkfD').value,cur:MKF.cur,price:+$('#mkfP').value,stock:$('#mkfS').value,status:MKF.status,type:MKF.type,ntd:$('#mkfT')?+$('#mkfT').value:'',photoData:MKF.photoData,clearPhoto:MKF.clearPhoto};
  toast('儲存中…');const r=await run(null,'mktSave',arg);if(r!==null){MK.tab='stall';mktOpen(MK.el,1)}}

<script>

<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e2c4"/></linearGradient>

  const lo=Math.min(...vis),hi=Math.max(...vis),Y=v=>tp+(hi-v)/(hi-lo||1)*ch,vm=Math.max(...S.map(d=>d[5]),1);
  let g='';for(let i=0;i<4;i++){const y=tp+i*ch/3;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1a2638"/><text x="${W-3}" y="${y-3}" fill="#5f6f88" font-size="10" text-anchor="end">${f2(hi-(hi-lo)*i/3)}</text>`}
  S.forEach((d,i)=>{const x=i*bw+bw/2,c=d[4]>=d[1]?'#ff4d5a':'#1fc48a',bh=Math.max(1,Math.abs(Y(d[1])-Y(d[4])));g+=`<line x1="${x}" x2="${x}" y1="${Y(d[2])}" y2="${Y(d[3])}" stroke="${c}"/><rect x="${x-bw*.36}" y="${Y(Math.max(d[1],d[4]))}" width="${bw*.72}" height="${bh}" fill="${c}"/>`;

const MLV=[null,['10 以內加減','一年級'],['20 以內加減','一、二年級'],['100 以內加減','二年級'],['九九乘法','二、三年級'],['除法＋兩位數乘法','三、四年級'],['四則混合','四年級以上']];
let MG=null;const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mathMini(){const m=G.math;if(!m)return '';return `<div class="card mcard" onclick="go('math')"><div class="mico">🧮</div><div style="flex:1"><b>心算快手</b><div class="mu">${m.left?`今天還有 <b class="gold">${m.left}</b> 場可以拿金幣`:'今天的金幣拿完了，還可以練習破紀錄'}</div></div><span class="go">開始 ›</span></div>`}

  $('#pg-math').innerHTML=`<button class="back" onclick="go('play')">‹ 遊樂區</button><div class="sign"><h3>🧮 心算快手</h3></div><div class="card"><div class="mu">60 秒內答越多題越好！每天前 ${m.daily} 場可以拿金幣和經驗（今天還有 <b class="gold">${m.left}</b> 場）。答對越多、等級越高，金幣越多。</div></div>
  <div class="mlv">${MLV.map((x,i)=>i<2?'':`<button class="mlb" onclick="mathStart(${i})"><b>Lv${i}</b><span>${x[0]}</span><small>${x[1]}${m.best[i]?`・最佳 ${m.best[i]} 題`:''}</small></button>`).join('')}</div>`}
function mathQ(lv){let a,b,c,q,ans;const h=Math.random()<.5;
  if(lv===1){if(h){a=RI(0,10);b=RI(0,10-a);q=`${a} + ${b}`;ans=a+b}else{a=RI(1,10);b=RI(0,a);q=`${a} − ${b}`;ans=a-b}}
  else if(lv===2){if(h){a=RI(2,15);b=RI(2,20-a);q=`${a} + ${b}`;ans=a+b}else{a=RI(8,20);b=RI(2,a);q=`${a} − ${b}`;ans=a-b}}
  else if(lv===3){if(h){a=RI(10,89);b=RI(5,99-a);q=`${a} + ${b}`;ans=a+b}else{a=RI(20,99);b=RI(5,a-1);q=`${a} − ${b}`;ans=a-b}}
  else if(lv===4){a=RI(2,9);b=RI(2,9);q=`${a} × ${b}`;ans=a*b}
  else if(lv===5){if(h){b=RI(2,9);ans=RI(2,9);a=b*ans;q=`${a} ÷ ${b}`}else{a=RI(11,49);b=RI(2,9);q=`${a} × ${b}`;ans=a*b}}
  else{const t=RI(0,3);if(t===0){a=RI(2,9);b=RI(2,9);c=RI(1,30);q=`${a}×${b}+${c}`;ans=a*b+c}else if(t===1){a=RI(3,9);b=RI(3,9);c=RI(1,a*b);q=`${a}×${b}−${c}`;ans=a*b-c}
    else if(t===2){a=RI(1,9);b=RI(1,9);c=RI(2,6);q=`(${a}+${b})×${c}`;ans=(a+b)*c}else{b=RI(2,9);const k=RI(2,9);a=b*k;c=RI(1,20);q=`${a}÷${b}+${c}`;ans=k+c}}
  return {q,ans}}
function mathStart(lv){MG={lv,correct:0,wrong:0,combo:0,inp:'',end:0,cur:null,busy:false};
  $('#pg-math').innerHTML=`<div class="mgame"><div class="mtop"><button class="mx" onclick="mathQuit()">✕</button><div class="mbar"><i id="mBar"></i></div><b id="mTime">60</b></div>
  <div class="mstat"><span>✅ <b id="mOk">0</b></span><span id="mCombo"></span><span>❌ <b id="mNg">0</b></span></div>
  <div class="mq" id="mQ">準備…</div><div class="ma" id="mA"></div>
  <div class="mkeys">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button onclick="mKey('${k}')">${k}</button>`).join('')}</div></div>`;
  let c=3;const cd=()=>{if(!MG||MG.lv!==lv)return;if(c>0){$('#mQ').textContent=c--;setTimeout(cd,700)}else{MG.end=Date.now()+60000;mNext();mTick()}};cd()}
function mNext(){MG.cur=mathQ(MG.lv);MG.inp='';$('#mQ').textContent=MG.cur.q+' = ?';$('#mA').textContent='';$('#mA').className='ma'}
function mTick(){if(!MG||!MG.end)return;const left=Math.max(0,MG.end-Date.now()),e=$('#mTime');if(!e)return;e.textContent=Math.ceil(left/1000);$('#mBar').style.width=(left/600)+'%';if(left<=0)return mathEnd();requestAnimationFrame(mTick)}
function mKey(k){if(!MG||!MG.end||MG.busy)return;if(k==='C')MG.inp='';else if(k==='⌫')MG.inp=MG.inp.slice(0,-1);else if(MG.inp.length<4)MG.inp+=k;
  $('#mA').textContent=MG.inp;const ans=String(MG.cur.ans);if(MG.inp.length<ans.length)return;MG.busy=true;
  if(MG.inp===ans){MG.correct++;MG.combo++;MG.combo>=3?sfx('combo',MG.combo):sfx('ok');$('#mA').className='ma ok';$('#mOk').textContent=MG.correct;$('#mCombo').textContent=MG.combo>=3?`🔥 ${MG.combo} 連對`:'';setTimeout(()=>{if(MG){MG.busy=false;mNext()}},180)}
  else{MG.wrong++;MG.combo=0;sfx('bad');$('#mNg').textContent=MG.wrong;$('#mCombo').textContent='';$('#mA').className='ma ng';$('#mA').textContent=MG.inp+' → '+ans;setTimeout(()=>{if(MG){MG.busy=false;mNext()}},900)}}
document.addEventListener('keydown',e=>{if(!MG||!MG.end)return;if(/^[0-9]$/.test(e.key))mKey(e.key);else if(e.key==='Backspace')mKey('⌫')});
async function mathQuit(){if(MG&&MG.end&&!await ask('<h3>要離開嗎？</h3>這一場不會算成績喔。','離開'))return;MG=null;drawMath()}
async function mathEnd(){if(!MG||MG.done)return;MG.done=true;MG.end=0;const g=MG;
  $('#pg-math').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">⏰</div><h3>時間到！</h3><div class="mu">送出成績中…</div></div>`;
  let r=null;try{r=await call('submitMath',{lv:g.lv,correct:g.correct,wrong:g.wrong})}catch(e){toast(errMsg(e),1)}
  if(r&&G.math){G.math.left=r.left;G.math.best[g.lv]=r.best}if(r){const x=GI();x.left.math=r.left;(x.best.math=x.best.math||{})[g.lv]=r.best;x.coinsToday+=r.coins||0}

const SDC={1:{n:4,br:2,bc:2,holes:8,sym:['🐚','⭐','🐠','🌴']},2:{n:6,br:2,bc:3,holes:20},3:{n:6,br:2,bc:3,holes:25},4:{n:9,br:3,bc:3,holes:30}};
function sdCan(a,n,br,bc,i,v){const r=Math.floor(i/n),c=i%n;for(let k=0;k<n;k++){if(a[r*n+k]===v||a[k*n+c]===v)return false}

function sdCount(a,n,br,bc,limit){let cnt=0,steps=0;const nums=[...Array(n)].map((_,i)=>i+1);
  const rec=()=>{if(++steps>200000){cnt=99;return true}let best=-1,bc2=99,opts=null;
    for(let i=0;i<a.length;i++){if(a[i])continue;const o=nums.filter(v=>sdCan(a,n,br,bc,i,v));if(o.length<bc2){bc2=o.length;best=i;opts=o;if(!bc2)return false}}
    if(best<0){cnt++;return cnt>=limit}
    for(const v of (limit===1?shuf(opts):opts)){a[best]=v;if(rec())return true;a[best]=0}return false};
  rec();return cnt}

    if(sdCount(p.slice(),n,C.br,C.bc,2)===1)holes++;else p[i]=v}
  return {sol,p}}

const FR=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=(a,b)=>b?g(b,a%b):Math.abs(a);const k=g(n,d)||1;return [n/k,d/k]};

function frOp(a,o,b){if(o==='+')return FR(a[0]*b[1]+b[0]*a[1],a[1]*b[1]);if(o==='-')return FR(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);if(o==='×')return FR(a[0]*b[0],a[1]*b[1]);if(!b[0])return null;return FR(a[0]*b[1],a[1]*b[0])}
function p24Tips(){const c=(...n)=>n.map(x=>`<b class="tipc">${x}</b>`).join('');

  <p><b>② 找一張關鍵牌，湊它的另一半</b><br>有 6 就湊 4，有 8 就湊 3，有 3 就湊 8，有 4 就湊 6。<br>${c(3,4,5,6)} → 先看 6，再用 3、4、5 湊出 4：(3+5)−4=4，4×6=24</p>
  <p><b>③ 兩張一組</b><br>${c(2,2,3,3)} → (2+2)×(3+3)=24</p>
  <p><b>④ 用不到的牌把它消掉</b><br>乘 1 不會變；兩張一樣的牌相減＝0、相除＝1。<br>${c(1,1,3,8)} → 3×8=24，再 ×1×1</p>
  <p><b>⑤ 全部加加看</b><br>${c(9,8,6,1)} → 9+8+6+1=24，有時候就這麼簡單！</p>
  <p><b>⑥ 卡住了就按「跳過」</b><br>會告訴你答案，看懂一種解法就多學會一招 💪</p>
  <p class="mu">金幣：入門每題 3、Lv2 每題 4、Lv3 每題 5（一場 5 題）</p></div>`,null,'知道了')}
function p24Solve(L,ops,st){if(L.length===1)return L[0].v[0]===24&&L[0].v[1]===1?L[0].e:null;

      const r=p24Solve(rest.concat([{v,e:'('+L[i].e+' '+o+' '+L[j].e+')'}]),ops,st);if(r)return r}}return null}

function pizzaSvg(n,k,size){const R=44,cx=50,cy=50;let s='';
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n,big=(a1-a0)>Math.PI?1:0;
    const p=n===1?`M${cx-R} ${cy}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0`:`M${cx} ${cy}L${(cx+R*Math.cos(a0)).toFixed(2)} ${(cy+R*Math.sin(a0)).toFixed(2)}A${R} ${R} 0 ${big} 1 ${(cx+R*Math.cos(a1)).toFixed(2)} ${(cy+R*Math.sin(a1)).toFixed(2)}Z`;
    s+=`<path d="${p}" fill="${i<k?'#ffcf4a':'#f6e2bd'}" stroke="#b5651d" stroke-width="1.6"/>`;
    if(i<k){const am=(a0+a1)/2;[[.62,0],[.36,.18],[.4,-.18]].forEach(([r,da])=>{if(n>8&&r<.5)return;const x=cx+R*r*Math.cos(am+da*(8/Math.max(n,4))),y=cy+R*r*Math.sin(am+da*(8/Math.max(n,4)));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${n>8?3:4.2}" fill="#d9412b"/>`})}}
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="48" fill="#e0a45c" stroke="#9a5a1a" stroke-width="2"/>${s}</svg>`}
const frH=(a,b)=>`<span class="frc"><i>${a}</i><i>${b}</i></span>`;
function pzQ(lv){const DN=[2,3,4,5,6,8];

    while(opts.size<4){const b=RI(2,9),a=RI(1,b-1);opts.add(a+'/'+b)}
    return {html:`<div class="pzq">${pizzaSvg(n,k,170)}</div><div class="pzt">有料的部分是披薩的幾分之幾？</div>`,opts:shuf([...opts]),ans:k+'/'+n}}
  if(lv===2){if(Math.random()<.5){let a,b,c,d;const t=RI(0,2);
      if(t===0){b=d=DN[RI(1,5)];a=RI(1,b-1);c=RI(1,d-1)}else if(t===1){a=c=RI(1,3);b=DN[RI(1,5)];d=DN[RI(1,5)];if(a>=b)b=a+1;if(c>=d)d=c+1}else{b=DN[RI(0,3)];a=RI(1,b-1);const m=RI(2,3);c=a*m;d=b*m}
      const L=a/b,Rr=c/d,ans=Math.abs(L-Rr)<1e-9?'一樣多':L>Rr?'左邊比較多':'右邊比較多';
      return {html:`<div class="pzq two"><div>${pizzaSvg(b,a,130)}${frH(a,b)}</div><div>${pizzaSvg(d,c,130)}${frH(c,d)}</div></div><div class="pzt">哪一邊的有料部分比較多？</div>`,opts:['左邊比較多','右邊比較多','一樣多'],ans}}
    const b=[2,3,4][RI(0,2)],a=RI(1,b-1),m=RI(2,3),ans=(a*m)+'/'+(b*m);const opts=new Set([ans]);

  const n=[4,5,6,8][RI(0,3)],sub=Math.random()<.4;let a,b,res,txt,pics;

function csQ(lv){const C=CSL[lv];for(let tries=0;;tries++){const k=RI(C.n[0],C.n[1]),its=shuf(CSIT).slice(0,k);let lines;
  if(C.q){lines=its.map(x=>({e:x[0],n:x[1],q:RI(C.q[0],C.q[1]),p:C.nice?csNice(C.disc):RI(C.u[0],C.u[1])}))}
  else{const tot=RI(C.t[0],C.t[1]);if(tot<(lv>=3?20:5)*k)continue;lines=csSplit(tot,k,lv>=3?20:5).map((p,i)=>({e:its[i][0],n:its[i][1],q:1,p}))}
  const sub=lines.reduce((a,l)=>a+l.p*l.q,0);if(sub<C.t[0]||sub>C.t[1])continue;
  const steps=[];let tot=sub;
  if(lv>=3)steps.push(lines.map(l=>l.q>1?`${l.p}×${l.q}`:l.p).join(' + ')+` = ${sub}`);
  let disc=null,full=null;
  if(C.disc){disc=CSDISC[RI(0,CSDISC.length-1)];if(sub*disc[0]%100)continue;tot=sub*disc[0]/100;steps.push(`${disc[2]}：${sub} × ${(disc[0]/100)} = ${tot}`)}
  if(C.full){full=Math.random()<.5?[1000,100]:[500,50];if(tot>=full[0]){steps.push(`滿 ${full[0]} 折 ${full[1]}：${tot} − ${full[1]} = ${tot-full[1]}`);tot-=full[1]}else steps.push(`${tot} 沒有滿 ${full[0]}，不能折`)}
  let base=lv===1?50:lv===2?100:tot<500?500:Math.ceil(tot/1000)*1000;if(base<=tot)base+=lv<=2?0:1000;if(base<=tot)continue;
  let extra=0;if(C.odd&&Math.random()<.75){const opts=[tot%10,tot%100,tot%50].filter(x=>x>0);if(opts.length)extra=opts[RI(0,opts.length-1)]}
  const pay=base+extra,chg=pay-tot;if(chg<=0||chg>=1000)continue;
  steps.push(`${pay} − ${tot} = ${chg}`);
  return {lines,sub,tot,disc,full,pay,extra,chg,steps,cus:csCus()}}}

function csK(k){const M=GM;if(!M||M.lock)return;const K=M.calc,n=+K.d||0;
  if(K.d==='錯誤'&&k!=='C')K.d='0';
  if(/[0-9.]/.test(k)){if(K.fresh){K.d=k==='.'?'0.':k;K.fresh=false}else if(K.d.length<12&&!(k==='.'&&K.d.includes('.')))K.d=K.d==='0'&&k!=='.'?k:K.d+k}

  else if(k==='B'){if(!K.fresh)K.d=K.d.length>1?K.d.slice(0,-1):'0'}

  sfx('click');csDraw()}

   <div class="xbody${c?'':' off'}">
    <label>② 轉給誰？</label><div class="xpeer">${x.peers.map(p=>`<button class="${XF.to===p?'on':''}" onclick="XF.to='${esc(p)}';drawXfer()">${avatar(pr[p],44)}${esc((pr[p]||{}).nick||p)}</button>`).join('')||'<div class="mu">沒有可以轉的人</div>'}</div>
    <label>③ 轉多少${c?'（'+U.u+'）':''}？</label><div class="xamt"><span>${U.pre||''}</span><input id="xA" type="number" inputmode="numeric" placeholder="0" value="${XF.amt}" oninput="XF.amt=this.value;xPrev()"><span>${U.suf||''}</span></div>
    <div class="xq">${[10,50,100,500].map(v=>`<button onclick="XF.amt='${v}';drawXfer()">${v}</button>`).join('')}</div>
    <div id="xP"></div>
    <label>④ 留言（可以不寫）</label><input id="xN" maxlength="20" placeholder="例如：生日快樂、還你的" value="${esc(XF.note)}" oninput="XF.note=this.value">
    <button class="xgo" id="xGo" onclick="xSend()">💸 轉帳</button>
   </div></div>
  <div class="card"><h3>📜 轉帳紀錄</h3>${x.list.map(h=>{const o=h.type==='轉帳轉出',u=XU[h.cur];return `<div class="it"><div>${o?'📤':'📥'} <span class="xtag ${u.c}">${u.name}</span> ${o?'轉給 '+esc(h.who):esc(h.who)+' 轉來'}<div class="mu">${h.time}${h.note?'・「'+esc(h.note)+'」':''}${o&&h.fee?'・含手續費 '+xAmt(h.cur,h.fee):''}</div></div><b class="${o?'minus':'plus'}">${o?'−':'+'}${xAmt(h.cur,h.amt)}</b></div>`}).join('')||'<div class="empty">還沒有轉帳紀錄</div>'}</div>
  <div class="card mu" style="font-size:13px;line-height:1.7">💡 轉帳會收 1% 手續費（最少 1），由轉出的人另外付。轉出去就馬上到對方那裡，不能取消，按之前要看清楚是 <span class="xtag g">🪙 金幣</span> 還是 <span class="xtag n">💵 台幣</span> 喔！</div>`;
  xPrev();loadImgs(x.peers.map(p=>(pr[p]||{}).photo).filter(Boolean))}
function xCur(c){if(XF.cur!==c){XF.cur=c;XF.amt=''}drawXfer()}
function xPrev(){const c=XF.cur,a=Math.round(+XF.amt||0),el=$('#xP'),b=$('#xGo');if(!el)return;
  if(!c||!a){el.innerHTML='';b.textContent='💸 轉帳';return}
  const f=xFee(a),have=c==='金幣'?S.xf.coins:S.xf.ntd,left=have-a-f,who=XF.to?esc(XF.to):'對方';
  el.innerHTML=`<div class="xprev"><div><span>${who} 收到</span><b>${xAmt(c,a)}</b></div><div><span>手續費 1%</span><span>+${xAmt(c,f)}</span></div><div class="tot"><span>你總共付</span><span>${xAmt(c,a+f)}</span></div><div><span>轉完剩下</span><b class="${left<0?'minus':''}">${left<0?'不夠！還差 '+xAmt(c,-left):xAmt(c,left)}</b></div></div>`;
  b.textContent=`💸 轉 ${xAmt(c,a)}${c==='金幣'?' 金幣':''} 給 ${who}`}
async function xSend(){const c=XF.cur,a=Math.round(+XF.amt||0),U=XU[c];
  if(!c)return toast('先選要轉金幣還是台幣',1);if(!XF.to)return toast('要轉給誰？',1);if(!(a>=1))return toast('請寫要轉多少',1);
  const f=xFee(a),have=c==='金幣'?S.xf.coins:S.xf.ntd;if(have<a+f)return toast((c==='金幣'?'金幣':'存摺的錢')+'不夠喔',1);
  if(!await ask(`<h3>確定要轉帳嗎？</h3><div class="xbig xtheme-${U.c}" style="background:var(--xbg);color:var(--xc2);border:3px solid var(--xc)">${U.name}${c==='台幣'?'（真的錢）':''}</div>
   <div style="font-size:17px;line-height:1.8">轉給 <b>${esc(XF.to)}</b>：<b>${xAmt(c,a)}</b><br>手續費：${xAmt(c,f)}<br>你總共會少 <b class="minus">${xAmt(c,a+f)}</b></div>${XF.note?`<div class="mu">留言：「${esc(XF.note)}」</div>`:''}<div class="mu" style="margin-top:6px">轉出去就不能取消喔</div>`,'確定轉帳'))return;
  try{const r=await call('xfer',{to:XF.to,cur:c,amt:a,note:XF.note});toast(r.msg);psfx&&psfx('coin')}catch(e){return toast(errMsg(e),1)}
  G_AT=0;loadGame();loadXfer()}

/* ===== 存摺 ===== */
async function loadBank(){const c=lcGet('getPassbook',me());if(c)bankDraw(c);else $('#pg-bank').innerHTML='<div class="card empty">⏳ 讀取中…</div>';
  let r;try{r=await call('getPassbook',me())}catch(e){if(!c)toast(errMsg(e),1);return}if(st.tab==='bank')bankDraw(r)}
function bankDraw(r){S.balance=r.balance;
  $('#pg-bank').innerHTML=`<div class="sign"><h3>🐷 ${esc(me())} 的存摺</h3></div>
  <div class="two"><div class="card wal"><div class="mu">💵 可以用的錢</div><div class="big">${n(r.balance)}</div></div><div class="card wal"><div class="mu">🌳 定存樹</div><div class="big plus">${n(r.depositTotal)}</div></div></div>
  <div class="card"><h3>🌳 我的定存樹</h3>${r.deposits.map(d=>`<div class="chest"><div class="row"><b>${n(d.principal)} 元</b><span class="mu">存 ${d.months} 個月</span></div>
   <div class="xp"><i style="width:${Math.round(d.progress*100)}%;background:linear-gradient(90deg,#9be3c4,#3fb98a)"></i></div><div class="mu">${d.start} → ${d.end}　到期利息 <b class="plus">+${n(d.full)}</b></div><button class="go sm" onclick="kWithdraw('${esc(d.id)}')">🪓 解約領出</button></div>`).join('')||'<div class="empty">還沒有定存，存一點錢讓它長利息吧！</div>'}</div>
  <div class="card"><h3>🌱 種一棵新的定存樹</h3><div class="mu">年利率 ${(S.rate*100).toFixed(1)}%・最少存 ${n(S.minDep)} 元・存越久利息越多</div>
   <label>💰 要存多少錢</label><input id="kdA" class="amt" type="number" inputmode="numeric" placeholder="${S.minDep||0}" oninput="kdPrev()">
   <label>⏳ 要存多久</label><div class="chips" id="kdM"></div><div id="kdP" class="mu" style="margin:6px 0"></div>
   <button class="go wide" onclick="kDeposit(this)">🌱 存進定存</button><div class="mu" style="text-align:center;margin-top:6px">想用錢的時候可以隨時解約，但利息會打折喔</div></div>
  <div class="card"><h3>📊 我的花費</h3><div class="chips" id="sQuick"></div><div id="statBody"></div></div>
  <div class="card"><h3>📜 存摺明細</h3><div class="mu">記錯了請找爸媽幫你修改喔！</div>${r.history.map(h=>`<div class="it"><div>${TYPE[h.type]||'•'} ${esc(h.type)}${h.cat?' · '+em(h.cat)+esc(h.cat):''}<div class="mu">${h.date}${h.note?'　'+esc(h.note):''}</div></div>
   <b class="${h.amount>=0?'plus':'minus'}">${h.amount>=0?'+':''}${n(h.amount)}</b></div>`).join('')||'<div class="empty">還沒有紀錄</div>'}</div>`;
  kdMon();drawQuick();loadStats()}
function kdMon(){chips($('#kdM'),[1,3,6,12],st.dm||3,v=>{st.dm=v;kdMon()},v=>v+' 個月');kdPrev()}
function kdPrev(){const a=+($('#kdA')||{}).value||0,m=st.dm||3,e=$('#kdP');if(!e)return;
  e.innerHTML=`到期日 ${addMonths(S.today,m)}${a>0?`・到期可以多拿 <b class="plus">+${n(Math.round(a*S.rate*m/12))}</b> 元利息`:''}${a>0&&a<S.minDep?`<br><b class="minus">最少要存 ${n(S.minDep)} 元喔</b>`:''}${a>S.balance?`<br><b class="minus">可以用的錢只有 ${n(S.balance)} 元</b>`:''}`}
async function kDeposit(btn){const a=+$('#kdA').value,m=st.dm||3;if(!(a>0))return toast('請輸入金額',1);if(a<S.minDep)return toast('最少要存 '+S.minDep+' 元喔',1);if(a>S.balance)return toast('可以用的錢不夠喔',1);
  if(!await ask(`<div style="text-align:center;font-size:44px">🌱</div><h3 style="text-align:center">確定要存定存嗎？</h3><div style="text-align:center">存 <b>${n(a)}</b> 元，存 <b>${m}</b> 個月<br>${addMonths(S.today,m)} 到期，可以多拿 <b class="plus">${n(Math.round(a*S.rate*m/12))}</b> 元</div>`,'存進去'))return;
  if(await run(btn,'createDeposit',{amount:a,months:m})!==null)loadBank()}
async function kWithdraw(id){let p;try{p=await call('previewWithdraw',id)}catch(e){return toast(errMsg(e),1)}
  const html=p.early?`<div style="text-align:center;font-size:44px">🪓</div><h3 style="text-align:center">還沒到期喔！</h3><div>現在解約可以拿回：<br>本金 <b>${n(p.principal)}</b> 元＋利息 <b class="plus">${n(p.interest)}</b> 元${p.interest?`（已經存 ${p.months} 個月，利息打 ${S.discount*10} 折）`:'（存不到一個月，沒有利息）'}<br><br>如果等到 ${p.end} 到期，可以拿 <b class="plus">${n(p.full)}</b> 元利息，<b class="minus">現在解約會少拿 ${n(p.full-p.interest)} 元</b>。</div>`:`<h3>定存到期了！</h3>本金 ${n(p.principal)}＋利息 ${n(p.interest)}，領回可以用的錢？`;
  if(!await ask(html,'確定解約'))return;if(await run(null,'withdrawDeposit',id)!==null)loadBank()}
function drawQuick(){chips($('#sQuick'),['this','last'],st.range,v=>{st.range=v;drawQuick();loadStats()},v=>v==='this'?'📅 本月':'⏪ 上個月')}
function rangeOf(k){let y=+S.today.slice(0,4),m=+S.today.slice(5,7);if(k==='last'){m--;if(m<1){m=12;y--}}const p=v=>String(v).padStart(2,'0');return [`${y}-${p(m)}-01`,`${y}-${p(m)}-${p(new Date(y,m,0).getDate())}`]}
async function loadStats(){const [from,to]=rangeOf(st.range);let r;try{r=await call('getStats',{book:me(),from,to})}catch(e){return}st.stats=r;
  $('#statBody').innerHTML=pie(r.cats,r.total,'#fffaf0')+r.cats.map((c,i)=>`<div class="it" onclick="showCat(${i})"><div><span class="dot" style="background:${COL[i%COL.length]}"></span>${em(c.cat)} ${esc(c.cat)}</div><b>${n(c.sum)}</b></div>`).join('')}
function showCat(i){const c=st.stats.cats[i];ask(`<h3>${em(c.cat)} ${esc(c.cat)}</h3>${st.stats.items.filter(x=>x.cat===c.cat).map(x=>`<div class="it"><div>${esc(x.note)||'（沒有備註）'}<div class="mu">${x.date}</div></div><b class="minus">${n(x.amount)}</b></div>`).join('')}`,null,'關閉')}

/* ===== 記帳 ===== */
function showBal(){const e=$('#kBal');if(e)e.textContent=S.balance==null?'…':'NT$ '+n(S.balance)}
async function refreshBal(){showBal();try{S.balance=await call('getBalance')}catch(e){}showBal()}
function drawRec(){showBal();chips($('#kCats'),S.cats,st.kCat,v=>{st.kCat=v;drawRec()},c=>'<b>'+em(c)+'</b>'+esc(c))}
async function sendKid(btn){const a=$('#kAmt').value;if(!(a>0))return toast('請輸入金額',1);
  const ok=await run(btn,'addChildRecord',{date:$('#kDate').value,kid:me(),type:'花錢',amount:a,cat:st.kCat,note:$('#kNote').value,syncParent:true});
  if(ok!==null){$('#kAmt').value='';$('#kNote').value='';if(ok&&ok.balance!=null){S.balance=ok.balance;showBal()}}}

/* ===== 啟動 ===== */
function start(r){S=r;st.kCat=r.cats[0]||'';$('#kDate').value=r.today;buildDock();drawRec()}
if(BOOT.init){start(BOOT.init);if(BOOT.game)showGame(BOOT.game);else loadGame();foCheck()}
else call('getInit').then(r=>{start(r);loadGame()}).catch(e=>{toast('載入失敗：'+errMsg(e),1);$('#pg-home').innerHTML='<div class="card empty">⚠️ 載入失敗：'+esc(errMsg(e))+'<br>請截圖給爸爸</div>'});
if(BOOT.stale)staleBadge(1);
window.__bootFresh=function(b){if(!b||!b.init)return;const m=MUT;
  if(b.forum){BOOT.forum=b.forum;PINS=b.forum.pins||[]}
  Object.assign(S,b.init);try{drawRec()}catch(e){}
  if(m)loadGame();else if(b.game)showGame(b.game);
  foCheck();staleBadge(0)};
if(BOOT.stale)bootRefresh();

</script>
</body></html>
