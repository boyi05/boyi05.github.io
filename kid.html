function pxPose(R,p){if(!p)return R;R=R.slice();const n=R.length;
 const sh=(s,d)=>d>0?'.'.repeat(d)+s.slice(0,s.length-d):s.slice(-d)+'.'.repeat(-d);
 if(p==='blink'||p==='sleep'||p==='eat')R=R.map(r=>r.replace(/we/g,'mm').replace(/oe/g,'oo').replace(/e/g,'o'));
 if(p==='sleep')return R.slice(0,n-2);
 if(p==='jump')return R.slice(0,n-1);
 if(p==='walk1'||p==='walk2'||p==='scratch'){const t=R[n-1];let a=-1,b=-1,best=0,i=t.search(/[^.]/);const e=t.length-1-t.split('').reverse().join('').search(/[^.]/);
  while(i>=0&&i<=e){if(t[i]==='.'){let j=i;while(j<=e&&t[j]==='.')j++;if(j-i>best){best=j-i;a=i;b=j}i=j}else i++}
  if(a<0)return R;const m=Math.floor((a+b)/2),d=p==='walk2'?1:-1;
  for(let k=n-2;k<n;k++)R[k]=sh(R[k].slice(0,m),d)+sh(R[k].slice(m),-d)}
 return R}

 const pal={o:C.o,m:C.m,d:C.d,l:C.l,a:C.a,e:sick?'#9a7ab0':C.e,w:C.w,x:C.x,g:C.g};
 const rows=pxPose(rows0.map(r=>sick?r.replace(/e/g,'o'):r),sick?'':o.pose);
 const target=[0,56,64,82,90,98][stage],c=target/Math.max(W,H*1.05),wpx=W*c,hpx=H*c;
 const ox=60-wpx/2,oy=106-rows.length*c;
 let defs=rad(u+'g',.5,.5,.5,[[0,'#000',.35],[1,'#000',0]])+rad(u+'gl',.5,.5,.5,[[0,C.g,.55],[1,C.g,0]])+lin(u+'cr',0,0,0,1,[[0,'#fff3a8'],[.5,'#ffc91f'],[1,'#d98a00']]);
 if(sh)defs+=`<linearGradient id="${u}h" x1="0" y1="0" x2="1" y2="1">${stp([[0,'#fff',0],[.4,'#fff',.0],[.5,'#fff',.55],[.6,'#fff',0],[1,'#fff',0]])}<animateTransform attributeName="gradientTransform" type="translate" values="-1 -1;1 1" dur="2.4s" repeatCount="indefinite"/></linearGradient>`;

 // 光暈
 aura+=`<ellipse cx="60" cy="${106-hpx*.5}" rx="${wpx*.75}" ry="${hpx*.7}" fill="url(#${u}gl)" class="pxpulse"/>`;
 if(stage>=4){aura+=`<g transform="translate(60 ${106-hpx*.5})"><g class="spin">${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<rect x="${(52*Math.cos(a)-3).toFixed(1)}" y="${(52*Math.sin(a)-3).toFixed(1)}" width="6" height="6" fill="${C.g}" opacity=".75" transform="rotate(45 ${(52*Math.cos(a)).toFixed(1)} ${(52*Math.sin(a)).toFixed(1)})"/>`}).join('')}</g></g>`}
 if(stage>=5&&!o.photo){defs+=rad(u+'au',.5,.5,.5,[[0,C.g,.5],[.6,C.g,.15],[1,C.g,0]]);aura=petAura(u,{a:C.g})+aura}
 // 方塊粒子

 fx+=parts.slice(0,stage>=3?6:3).map(([x,y,d],i)=>q(60+x,106+y,i%2?3:4,i%2?C.a:C.g,'pxfly',d)).join('');
 if(sp==='pxdragon'&&big&&!sick){fx+=`<g class="breath">${q(ox+wpx+2,oy+hpx*.36,5,C.a)}${q(ox+wpx+8,oy+hpx*.33,6,C.g)}${q(ox+wpx+15,oy+hpx*.3,5,C.l)}${q(ox+wpx+9,oy+hpx*.42,4,C.a)}</g>`}

 if(sp==='pxshark'&&big){fx+=`<g class="jet">${q(ox+c*4,106-1,c*.9,C.x)}${q(ox+c*10,106-1,c*.9,C.x)}${q(ox+c*4.2,106+c*.8,c*.6,'#ffd23f')}${q(ox+c*10.2,106+c*.8,c*.6,'#ffd23f')}</g>`;if(stage>=4)fx+=`<rect class="laser" x="${ox-38}" y="${oy+c*8.2}" width="40" height="${c*.6}" fill="${C.a}" opacity=".8"/>`}

 const ex=Math.max(1.6,c*.4);
 const body=`<g opacity=".55">${pxRects(rows,pal,c,ox+ex,oy+ex,C.o)}</g>${pxRects(rows,pal,c,ox,oy)}`;
 const shine=sh?`<rect x="${ox}" y="${oy}" width="${wpx}" height="${hpx}" fill="url(#${u}h)" style="mix-blend-mode:screen"/>`:'';
 return `<defs>${defs}</defs>${aura}<ellipse cx="60" cy="108" rx="${wpx*.45}" ry="5" fill="url(#${u}g)"/>${petPoo(o.poops)}<g class="pxbob" shape-rendering="crispEdges">${body}${shine}</g>${fx}`}

function islandSvg(lv,nm,pet){
  const L=Math.min(lv,150),rx=170+L*.8,ry=58+L*.19;
  const items=UNLOCK.filter(u=>u[0]<=lv&&!((u[1]==='帳篷'||u[1]==='營火')&&lv>=51)).sort((a,b)=>a[2]-b[2]);
  return `<svg viewBox="0 0 760 480" width="100%" style="display:block">${defs()}${sky(620)}${sea}${island(rx,ry)}${items.map(u=>{const t=u[3](nm),m=/^<g transform="translate[(]([-0-9.]+) ([-0-9.]+)[)](?: scale[(]([0-9.]+)[)])?/.exec(t),k=m&&m[3]?+m[3]:1;return (m?`<ellipse cx="${m[1]}" cy="${+m[2]+1}" rx="${26*k}" ry="${6*k}" fill="#2a6a40" opacity=".2"/>`:'')+t}).join('')}${pet?`<g transform="translate(${pet.stage?440:455} ${pet.stage?232:246}) scale(${pet.stage?.75:.6})">${petG(pet.species,pet.stage,{shiny:pet.shiny,sick:pet.sick,mood:pet.mood})}</g>`:''}</svg>`}
function nextUnlock(lv){const u=UNLOCK.find(x=>x[0]>lv);return u?`Lv.${u[0]} 會出現「${u[1]}」`:'下一個時期的新東西，爸爸正在準備中！'}
function troubleSvg(d,size){const t=T[d-1];return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${t[2]}</svg>`}

const SDC={1:{n:4,br:2,bc:2,holes:8,sym:['🐚','⭐','🐠','🌴']},2:{n:6,br:2,bc:3,holes:20},3:{n:9,br:3,bc:3,holes:44},4:{n:9,br:3,bc:3,holes:54}};
function sdCan(a,n,br,bc,i,v){const r=Math.floor(i/n),c=i%n;for(let k=0;k<n;k++){if(a[r*n+k]===v||a[k*n+c]===v)return false}
  const r0=r-r%br,c0=c-c%bc;for(let y=r0;y<r0+br;y++)for(let x=c0;x<c0+bc;x++)if(a[y*n+x]===v)return false;return true}
function sdCount(a,n,br,bc,limit){let cnt=0,steps=0;const nums=[...Array(n)].map((_,i)=>i+1);
  const rec=()=>{if(++steps>200000){cnt=99;return true}let best=-1,bc2=99,opts=null;
    for(let i=0;i<a.length;i++){if(a[i])continue;const o=nums.filter(v=>sdCan(a,n,br,bc,i,v));if(o.length<bc2){bc2=o.length;best=i;opts=o;if(!bc2)return false}}
    if(best<0){cnt++;return cnt>=limit}
    for(const v of (limit===1?shuf(opts):opts)){a[best]=v;if(rec())return true;a[best]=0}return false};
  rec();return cnt}

  const p=sol.slice();let holes=0;for(const i of shuf([...Array(n*n).keys()])){if(holes>=C.holes)break;const v=p[i];p[i]=0;
    if(sdCount(p.slice(),n,C.br,C.bc,2)===1)holes++;else p[i]=v}
  return {sol,p}}

const FR=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=(a,b)=>b?g(b,a%b):Math.abs(a);const k=g(n,d)||1;return [n/k,d/k]};

  ask(`<h3>📖 24 點小技巧</h3><div class="tips">

  <p><b>② 找一張關鍵牌，湊它的另一半</b><br>有 6 就湊 4，有 8 就湊 3，有 3 就湊 8，有 4 就湊 6。<br>${c(3,4,5,6)} → 先看 6，再用 3、4、5 湊出 4：(3+5)−4=4，4×6=24</p>
  <p><b>③ 兩張一組</b><br>${c(2,2,3,3)} → (2+2)×(3+3)=24</p>
  <p><b>④ 用不到的牌把它消掉</b><br>乘 1 不會變；兩張一樣的牌相減＝0、相除＝1。<br>${c(1,1,3,8)} → 3×8=24，再 ×1×1</p>
  <p><b>⑤ 全部加加看</b><br>${c(9,8,6,1)} → 9+8+6+1=24，有時候就這麼簡單！</p>

function p24Solve(L,ops,st){if(L.length===1)return L[0].v[0]===24&&L[0].v[1]===1?L[0].e:null;

function pizzaSvg(n,k,size){const R=44,cx=50,cy=50;let s='';

function wdList(lv){return WDS[lv].split(',').map(s=>{const m=/^([a-z]+)(.+?)([一-鿿]+)$/.exec(s);return {w:m[1],e:m[2],zh:m[3]}})}
function say(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function wdStart(lv){const L=shuf(wdList(lv));let seen=[];try{seen=JSON.parse(localStorage.getItem('wdSeen'+lv)||'[]')}catch(e){}
  const list=L.filter(x=>!seen.includes(x.w)).concat(L.filter(x=>seen.includes(x.w))).slice(0,10);
  seen=seen.concat(list.map(x=>x.w)).slice(-Math.floor(L.length*.75));try{localStorage.setItem('wdSeen'+lv,JSON.stringify(seen))}catch(e){}
  GM={g:'word',lv,live:true,q:0,c:0,w:0,list};wdNext()}
function wdNext(){const M=GM;if(M.q>=10)return gmEnd('word',M.lv,M.c,M.w,0,`<div class="mbig">${M.c}<small> / 10 個</small></div><div class="mu">拼錯 ${M.w} 個</div>`);
  const W=M.list[M.q],ex=[0,0,1,2][M.lv],AB='abcdefghijklmnopqrstuvwxyz';let extra=[];while(extra.length<ex){const ch=AB[RI(0,25)];if(!W.w.includes(ch)&&!extra.includes(ch))extra.push(ch)}
  M.W=W;M.tiles=shuf(W.w.split('').concat(extra)).map((ch,i)=>({ch,i,used:false}));M.slots=Array(W.w.length).fill(null);M.lock=false;wdDraw()}
function wdDraw(state){const M=GM,W=M.W;
  $('#pg-gm').innerHTML=`${backBtn()}<div class="gtop"><b>🔤 英文單字 Lv${M.lv}</b><span>第 ${M.q+1} / 10 個　✅ ${M.c}</span></div>
  <div class="card wdcard"><div class="wde">${W.e}</div><div class="wdz">${W.zh}<button class="say" onclick="say('${W.w}')">🔊</button></div>
  <div class="wds ${state||''}">${M.slots.map((t,i)=>`<button onclick="wdBack(${i})">${t==null?'':M.tiles[t].ch}</button>`).join('')}</div>
  ${state==='ng'?`<div class="wdans">正確是 <b>${W.w}</b></div>`:''}
  <div class="wdt">${M.tiles.map((t,i)=>`<button class="${t.used?'used':''}" onclick="wdTap(${i})">${t.ch}</button>`).join('')}</div></div>`}
function wdTap(i){const M=GM;if(!M||M.lock||M.tiles[i].used)return;const k=M.slots.indexOf(null);if(k<0)return;M.slots[k]=i;M.tiles[i].used=true;
  if(M.slots.indexOf(null)<0){M.lock=true;const got=M.slots.map(t=>M.tiles[t].ch).join(''),ok=got===M.W.w;if(ok)M.c++;else M.w++;wdDraw(ok?'ok':'ng');M.q++;say(M.W.w);if(ok)setTimeout(()=>{if(GM===M&&!M.dead)wdNext()},1000);else $('.wdcard').insertAdjacentHTML('beforeend',gmNextBtn('wdGo()'))}
  else wdDraw()}
function wdGo(){const M=GM;if(M&&!M.dead)wdNext()}
function wdBack(k){const M=GM;if(!M||M.lock||M.slots[k]==null)return;M.tiles[M.slots[k]].used=false;M.slots[k]=null;wdDraw()}
function petMini(v){const L=(PET&&PET.list)||[];if(!v)return `<div class="card" onclick="go('pet')" style="cursor:pointer;display:flex;align-items:center;gap:10px">${petSvg('sheep',0,{},56)}<div style="flex:1"><b>還沒有寵物</b><div class="mu">去領養一顆蛋，把牠養大吧！${PET&&PET.zoo&&PET.zoo.length?'<br>🏞️ 動物園裡有 '+PET.zoo.length+' 隻老朋友':''}</div></div><span class="mu">›</span></div>`;
  const wv=x=>x.ready?'💝 長大了，帶牠去動物園':x.sick?'🤒 生病了！':x.poops>=2?'💩 要清大便了':x.full<30?'🍙 肚子餓了':x.mood<30?'😢 想要玩':'';
  const bad=L.find(x=>wv(x)),show=bad||v,warn=wv(show);
  return `<div class="card" onclick="${bad?`petPick('${bad.id}');`:''}go('pet')" style="cursor:pointer;display:flex;align-items:center;gap:10px">${petSvg(show.species,show.stage,{shiny:show.shiny,sick:show.sick,mood:show.mood,crack:show.stage===0&&show.hatchIn<3},60)}<div style="flex:1"><b>${esc(show.name)}</b> <span class="mu">${show.typeName}・${show.stageName}</span>${warn?`<div style="color:#e5484d;font-size:14px">${warn}</div>`:`<div class="mu">${show.stage?'精神很好！':'還要 '+Math.ceil(show.hatchIn)+' 小時孵化'}${L.length>1?'・一共養了 '+L.length+' 隻':''}</div>`}</div><span class="mu">去照顧 ›</span></div>`}

function petPick(id){if(!PET||!PET.list)return;const f=PET.list.find(x=>x.id===id);if(!f)return;PET.sel=id;PET.now=f;PET.zooOpen=false;PB.key='';if(st.tab==='pet')drawPet()}

  for(let i=0;i<SP.length;i++){

      h+=`<button class="pslot ${on?'on':''}" onclick="petPick('${x.id}')">${al?'<i class="pdot"></i>':''}${petSvg(x.species,x.stage,{shiny:x.shiny,sick:x.sick,mood:x.mood,poops:0},46)}<span>${esc(x.name)}</span></button>`}
    else if(i<S)h+=`<button class="pslot empty" onclick="petShopGo()"><div style="font-size:26px;line-height:46px">🥚</div><span>空位・去領養</span></button>`;

function petShopGo(){const e=$('#petShop');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
async function petUnlockBox(){const S=PET.slots||1,SP=PET.slotPrice||[0,200,400];if(S>=SP.length)return toast('飼養區已經全部解鎖了');

  const r=await run(null,'petBye',{id:v.id});if(!r)return;
  await ask(`<div style="text-align:center"><div style="font-size:40px">🏞️</div><h3>${esc(r.msg)}</h3>你得到了：<div class="mgrid" style="margin-top:8px">${r.memos.map(m=>memoCard({name:m,species:r.species,shiny:/閃亮/.test(m)||(/合照/.test(m)&&r.shiny)})).join('')}</div><div class="mu" style="margin-top:6px">紀念品放在「我的 → 徽章」的紀念品櫃</div></div>`,null,'好');
  if(r.pet)petSet(r.pet);PB.key='';drawPet();loadGame()}
/* ===== 島上動物園：養大的寵物住在這裡，不用照顧，可以摸摸 ===== */
const ZOO={t:null,a:[]};
function zooOpen(){PET.zooOpen=true;clearTimeout(PB.t);PB.key='';drawPet();window.scrollTo(0,0)}
function zooClose(){PET.zooOpen=false;clearInterval(ZOO.t);PB.key='';drawPet()}
function zooBg(){return `<svg class="zbg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"><g fill="#fff" opacity=".85"><ellipse cx="70" cy="40" rx="30" ry="11"/><ellipse cx="88" cy="32" rx="18" ry="11"/><ellipse cx="300" cy="56" rx="26" ry="9"/></g>
 <path d="M0 132 C60 118 120 128 200 122 C280 116 340 126 400 120 V300 H0Z" fill="#9ed67a"/><path d="M0 132 C60 118 120 128 200 122 C280 116 340 126 400 120" fill="none" stroke="#7cbd5a" stroke-width="3"/>
 ${[[30,118,1],[360,114,1.2],[250,120,.8]].map(([x,y,s])=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-26" width="8" height="28" fill="#a0703c"/><circle cx="0" cy="-36" r="18" fill="#5cb85c"/><circle cx="-10" cy="-28" r="12" fill="#6cc86a"/><circle cx="10" cy="-30" r="13" fill="#4fae50"/></g>`).join('')}
 <g stroke="#c89a62" stroke-width="3" fill="none">${Array.from({length:21},(_,i)=>`<path d="M${i*20} 126 v-16"/>`).join('')}<path d="M0 114 H400 M0 121 H400"/></g>
 <g transform="translate(150 96)"><rect x="-2" y="0" width="4" height="26" fill="#a0703c"/><rect x="-34" y="-14" width="68" height="18" rx="4" fill="#fff4d6" stroke="#a0703c" stroke-width="2"/><text x="0" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a1c">島上動物園</text></g>
 <ellipse cx="330" cy="250" rx="48" ry="14" fill="#8fd3f4" stroke="#6ab8de" stroke-width="2"/>
 ${[[40,200,'#ffb0c0'],[110,270,'#fff'],[200,230,'#ffd86a'],[270,280,'#ffb0c0'],[380,200,'#fff'],[60,290,'#ffd86a']].map(([x,y,c])=>`<g transform="translate(${x} ${y})"><circle r="3.4" fill="${c}"/><circle r="1.4" fill="#e8a43c"/></g>`).join('')}</svg>`}
function drawZoo(){const el=$('#pg-pet'),Z=PET.zoo||[];clearInterval(ZOO.t);const lanes=Math.max(2,Math.min(4,Math.ceil(Z.length/3))),H=190+lanes*44;
  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><button class="go" style="padding:6px 12px" onclick="zooClose()">‹ 回寵物</button><b style="font-size:19px">🏞️ 島上動物園</b><span class="mu" style="margin-left:auto">${Z.length} 隻</span></div>
  <div class="zoo" id="zoo" style="height:${H}px">${zooBg()}${Z.map((z,i)=>`<div class="zan" id="za${i}" onclick="zooTap(${i})"><div class="zbub" id="zb${i}"></div><div class="zf" id="zf${i}"><div class="za" id="zz${i}">${petSvg(z.species,5,{shiny:z.shiny,mood:90,poops:0,photo:1},92)}</div></div><div class="zname">${esc(z.name)}</div></div>`).join('')}</div>
  <div class="card mu">${Z.length?'這些都是你親手養大的寵物！牠們在這裡不用照顧，點一下可以摸摸牠們。':'還沒有寵物住進來。把寵物養到第 10 天，就可以送牠來動物園。'}</div>
  ${Z.length?`<div class="card"><b>📖 入住紀錄</b>${Z.slice().reverse().map(z=>`<div class="mu" style="display:flex;justify-content:space-between;margin-top:4px"><span>${esc(z.name)}（${(PET.types[z.species]||{}).name||''}${z.shiny?'・✨閃亮':''}）</span><span>${z.date||''}</span></div>`).join('')}</div>`:''}`;
  const box=$('#zoo');if(!box||!Z.length)return;const W=box.clientWidth||340;
  ZOO.a=Z.map((z,i)=>{const lane=i%lanes,x=Math.random()*(W-92),e=$('#za'+i);e.style.left=x+'px';e.style.bottom=(8+(lanes-1-lane)*44)+'px';e.style.zIndex=10+lane;return {z,x,lane}});
  ZOO.t=setInterval(()=>{if(!$('#zoo')||st.tab!=='pet'||!PET||!PET.zooOpen){clearInterval(ZOO.t);return}
    const k=Math.floor(Math.random()*ZOO.a.length),A=ZOO.a[k],nx=Math.max(0,Math.min(W-92,A.x+(Math.random()*2-1)*W*.5)),d=Math.abs(nx-A.x),ms=Math.round(d/55*1000),e=$('#za'+k),f=$('#zf'+k),a=$('#zz'+k);if(!e||d<10)return;
    f.classList.toggle('l',(nx<A.x?-1:1)*(PFACE[A.z.species]||1)<0);e.style.transitionDuration=ms+'ms';e.style.left=nx+'px';A.x=nx;a.className='za walk';setTimeout(()=>{if(a.className==='za walk')a.className='za'},ms)},1600)}
function zooTap(i){const A=ZOO.a[i];if(!A)return;const a=$('#zz'+i),b=$('#zb'+i);if(a){a.className='za hop';setTimeout(()=>{if(a.className==='za hop')a.className='za'},750)}
  petVoice(A.z.species);if(b){b.textContent=pbPick(PSND[A.z.species]||['♪']);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1300)}}
/* ===== 徽章 ===== */
function drawBadges(){if(G.badges)$('#bdBody').innerHTML=badgeWall(G.badges)}

/* ===== 個人資料 ===== */
const PICK=Object.keys(SPR);
async function editProfile(){const p=prof();
  const ok=await ask(`<h3>✏️ 我的資料</h3><label>暱稱（每天可以改一次）</label><input id="nickIn" maxlength="12" value="${esc(p.nick||me())}">
   <button class="go wide" onclick="saveNick()">儲存暱稱</button><label>頭像（每天可以換一次）</label>
   <button class="go wide" onclick="upPhoto()">📷 用我的照片</button><div class="pick">${PICK.map(k=>`<button onclick="setIcon('${k}')">${sprite(k,46)}<br>${k}</button>`).join('')}</div>`,null,'關閉')}
async function saveNick(){const v=$('#nickIn').value.trim();if(!v)return toast('請輸入暱稱',1);if(await run(null,'setProfile',{nick:v})!==null){S.profiles[S.me].nick=v;afterProfile()}}
async function setIcon(k){if(await run(null,'setProfile',{icon:k})!==null){S.profiles[S.me].icon=k;S.profiles[S.me].photo='';afterProfile()}}
async function upPhoto(){let d;try{d=await pickPhoto(256)}catch(e){return toast(errMsg(e),1)}toast('上傳中…');
  if(await run(null,'setProfile',{photo:d})!==null){try{S=Object.assign(S,await call('getInit'))}catch(e){}afterProfile()}}
function afterProfile(){$('#modal').classList.add('hidden');drawHud();if(st.tab==='home')drawHome()}

/* ===== 存摺 ===== */
async function loadBank(){$('#pg-bank').innerHTML='<div class="card empty">⏳ 讀取中…</div>';
  let r;try{r=await call('getPassbook',me())}catch(e){return toast(errMsg(e),1)}S.balance=r.balance;
  $('#pg-bank').innerHTML=`<div class="sign"><h3>🐷 ${esc(me())} 的存摺</h3></div>
  <div class="two"><div class="card wal"><div class="mu">💵 可以用的錢</div><div class="big">${n(r.balance)}</div></div><div class="card wal"><div class="mu">🌳 定存樹</div><div class="big plus">${n(r.depositTotal)}</div></div></div>
  <div class="card"><h3>🌳 我的定存樹</h3>${r.deposits.map(d=>`<div class="chest"><div class="row"><b>${n(d.principal)} 元</b><span class="mu">存 ${d.months} 個月</span></div>
   <div class="xp"><i style="width:${Math.round(d.progress*100)}%;background:linear-gradient(90deg,#9be3c4,#3fb98a)"></i></div><div class="mu">${d.start} → ${d.end}　到期利息 <b class="plus">+${n(d.full)}</b></div><button class="go sm" onclick="kWithdraw('${esc(d.id)}')">🪓 解約領出</button></div>`).join('')||'<div class="empty">還沒有定存，存一點錢讓它長利息吧！</div>'}</div>
  <div class="card"><h3>🌱 種一棵新的定存樹</h3><div class="mu">年利率 ${(S.rate*100).toFixed(1)}%・最少存 ${n(S.minDep)} 元・存越久利息越多</div>
   <label>💰 要存多少錢</label><input id="kdA" class="amt" type="number" inputmode="numeric" placeholder="${S.minDep||0}" oninput="kdPrev()">
   <label>⏳ 要存多久</label><div class="chips" id="kdM"></div><div id="kdP" class="mu" style="margin:6px 0"></div>
   <button class="go wide" onclick="kDeposit(this)">🌱 存進定存</button><div class="mu" style="text-align:center;margin-top:6px">想用錢的時候可以隨時解約，但利息會打折喔</div></div>
  <div class="card"><h3>📊 我的花費</h3><div class="chips" id="sQuick"></div><div id="statBody"></div></div>
  <div class="card"><h3>📜 存摺明細</h3><div class="mu">記錯了請找爸媽幫你修改喔！</div>${r.history.map(h=>`<div class="it"><div>${TYPE[h.type]||'•'} ${esc(h.type)}${h.cat?' · '+em(h.cat)+esc(h.cat):''}<div class="mu">${h.date}${h.note?'　'+esc(h.note):''}</div></div>
   <b class="${h.amount>=0?'plus':'minus'}">${h.amount>=0?'+':''}${n(h.amount)}</b></div>`).join('')||'<div class="empty">還沒有紀錄</div>'}</div>`;
  kdMon();drawQuick();loadStats()}
function kdMon(){chips($('#kdM'),[1,3,6,12],st.dm||3,v=>{st.dm=v;kdMon()},v=>v+' 個月');kdPrev()}
function kdPrev(){const a=+($('#kdA')||{}).value||0,m=st.dm||3,e=$('#kdP');if(!e)return;
  e.innerHTML=`到期日 ${addMonths(S.today,m)}${a>0?`・到期可以多拿 <b class="plus">+${n(Math.round(a*S.rate*m/12))}</b> 元利息`:''}${a>0&&a<S.minDep?`<br><b class="minus">最少要存 ${n(S.minDep)} 元喔</b>`:''}${a>S.balance?`<br><b class="minus">可以用的錢只有 ${n(S.balance)} 元</b>`:''}`}
async function kDeposit(btn){const a=+$('#kdA').value,m=st.dm||3;if(!(a>0))return toast('請輸入金額',1);if(a<S.minDep)return toast('最少要存 '+S.minDep+' 元喔',1);if(a>S.balance)return toast('可以用的錢不夠喔',1);
  if(!await ask(`<div style="text-align:center;font-size:44px">🌱</div><h3 style="text-align:center">確定要存定存嗎？</h3><div style="text-align:center">存 <b>${n(a)}</b> 元，存 <b>${m}</b> 個月<br>${addMonths(S.today,m)} 到期，可以多拿 <b class="plus">${n(Math.round(a*S.rate*m/12))}</b> 元</div>`,'存進去'))return;
  if(await run(btn,'createDeposit',{amount:a,months:m})!==null)loadBank()}
async function kWithdraw(id){let p;try{p=await call('previewWithdraw',id)}catch(e){return toast(errMsg(e),1)}
  const html=p.early?`<div style="text-align:center;font-size:44px">🪓</div><h3 style="text-align:center">還沒到期喔！</h3><div>現在解約可以拿回：<br>本金 <b>${n(p.principal)}</b> 元＋利息 <b class="plus">${n(p.interest)}</b> 元${p.interest?`（已經存 ${p.months} 個月，利息打 ${S.discount*10} 折）`:'（存不到一個月，沒有利息）'}<br><br>如果等到 ${p.end} 到期，可以拿 <b class="plus">${n(p.full)}</b> 元利息，<b class="minus">現在解約會少拿 ${n(p.full-p.interest)} 元</b>。</div>`:`<h3>定存到期了！</h3>本金 ${n(p.principal)}＋利息 ${n(p.interest)}，領回可以用的錢？`;
  if(!await ask(html,'確定解約'))return;if(await run(null,'withdrawDeposit',id)!==null)loadBank()}
function drawQuick(){chips($('#sQuick'),['this','last'],st.range,v=>{st.range=v;drawQuick();loadStats()},v=>v==='this'?'📅 本月':'⏪ 上個月')}
function rangeOf(k){let y=+S.today.slice(0,4),m=+S.today.slice(5,7);if(k==='last'){m--;if(m<1){m=12;y--}}const p=v=>String(v).padStart(2,'0');return [`${y}-${p(m)}-01`,`${y}-${p(m)}-${p(new Date(y,m,0).getDate())}`]}
async function loadStats(){const [from,to]=rangeOf(st.range);let r;try{r=await call('getStats',{book:me(),from,to})}catch(e){return}st.stats=r;
  $('#statBody').innerHTML=pie(r.cats,r.total,'#fffaf0')+r.cats.map((c,i)=>`<div class="it" onclick="showCat(${i})"><div><span class="dot" style="background:${COL[i%COL.length]}"></span>${em(c.cat)} ${esc(c.cat)}</div><b>${n(c.sum)}</b></div>`).join('')}
function showCat(i){const c=st.stats.cats[i];ask(`<h3>${em(c.cat)} ${esc(c.cat)}</h3>${st.stats.items.filter(x=>x.cat===c.cat).map(x=>`<div class="it"><div>${esc(x.note)||'（沒有備註）'}<div class="mu">${x.date}</div></div><b class="minus">${n(x.amount)}</b></div>`).join('')}`,null,'關閉')}

/* ===== 記帳 ===== */
function showBal(){const e=$('#kBal');if(e)e.textContent=S.balance==null?'…':'NT$ '+n(S.balance)}
async function refreshBal(){showBal();try{S.balance=await call('getBalance')}catch(e){}showBal()}
function drawRec(){showBal();chips($('#kCats'),S.cats,st.kCat,v=>{st.kCat=v;drawRec()},c=>'<b>'+em(c)+'</b>'+esc(c))}
async function sendKid(btn){const a=$('#kAmt').value;if(!(a>0))return toast('請輸入金額',1);
  const ok=await run(btn,'addChildRecord',{date:$('#kDate').value,kid:me(),type:'花錢',amount:a,cat:st.kCat,note:$('#kNote').value,syncParent:true});
  if(ok!==null){$('#kAmt').value='';$('#kNote').value='';if(ok&&ok.balance!=null){S.balance=ok.balance;showBal()}}}

/* ===== 啟動 ===== */
function start(r){S=r;st.kCat=r.cats[0]||'';$('#kDate').value=r.today;buildDock();drawRec()}
if(BOOT.init){start(BOOT.init);if(BOOT.game)showGame(BOOT.game);else loadGame();foCheck()}
else call('getInit').then(r=>{start(r);loadGame()}).catch(e=>{toast('載入失敗：'+errMsg(e),1);$('#pg-home').innerHTML='<div class="card empty">⚠️ 載入失敗：'+esc(errMsg(e))+'<br>請截圖給爸爸</div>'});

</script>
</body></html>
